{% extends "base.html" %}

{% block title %}Resend Email Verification - MatDan Portal{% endblock %}

{% block content %}
<div class="container my-5 py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card custom-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                        <i class="bi bi-envelope-check-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Resend Verification</h3>
                    <p class="text-muted small">Enter your registered email address or EPIC Voter ID to receive a new activation link.</p>
                </div>

                <form method="POST" action="{{ url_for('resend_verification') }}" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-4">
                        <label for="identity" class="form-label fw-semibold">Registered Email or EPIC Number</label>
                        <input type="text" id="identity" name="identity" class="form-control rounded-3" placeholder="e.g. rajesh@example.in or DLX1234567" required />
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary-custom rounded-pill py-2 font-weight-bold">
                            Send New Verification Email
                        </button>
                        <a href="{{ url_for('login') }}" class="btn btn-outline-secondary rounded-pill py-2 text-center">
                            Cancel & Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
